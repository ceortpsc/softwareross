name: Dependency review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dependency_review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
