name: Configure Branch Protection

on:
  workflow_dispatch:

jobs:
  protect-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      administration: write

    steps:
      - name: Set branch protection using GH CLI
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_GITHUB_TOKEN is not set. Add an admin PAT to secrets to run this workflow." && exit 1
          fi
          echo "Setting branch protection for main..."
          gh api -X PUT -H "Authorization: token $ADMIN_TOKEN" \
            /repos/${REPO}/branches/main/protection -f required_status_checks='{"strict":true,"contexts":[]}' -f enforce_admins=true -f required_pull_request_reviews='{"dismissal_restrictions":{},"dismiss_stale_reviews":true,"require_code_owner_reviews":true,"required_approving_review_count":1}'
