name: Auto Upgrade Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # weekly

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upgrade Maven dependencies (safe)
        run: |
          mvn -B -DskipTests org.codehaus.mojo:versions-maven-plugin:2.15.0:use-latest-releases -DgenerateBackupPoms=false || true

      - name: Upgrade frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npx npm-check-updates -u || true
          npm install || true

      - name: Create branch, commit, and open PR if changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="deps/update-$(date +%Y%m%d%H%M%S)"
            git checkout -b $BRANCH
            git add -A
            git commit -m "chore(deps): upgrade dependencies\n\nAutomated by CI"
            git push --set-upstream origin $BRANCH
            echo "Branch $BRANCH pushed"
            curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pulls -d "{\"title\":\"chore(deps): automated dependency upgrades\",\"head\":\"$BRANCH\",\"base\":\"main\",\"body\":\"Automated dependency upgrades via workflow. Please review and run tests.\"}"
          else
            echo "No changes to commit"
          fi
