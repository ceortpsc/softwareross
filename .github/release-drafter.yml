name: Release Drafter
on:
  push:
    branches:
      - main

template:
  name-template: "v$NEXT_PATCH"
  tag-template: "v$NEXT_PATCH"
  categories:
    - title: "🚀 Features"
      labels:
        - feature
    - title: "🐛 Fixes"
      labels:
        - bug
    - title: "🧰 Maintenance"
      labels:
        - chore
  change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
  no-changes-template: "No changes since last release"
  include:
    - type: issue
  exclude-labels:
    - skip-release
